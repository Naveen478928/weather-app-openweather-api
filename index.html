<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Weather App</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;

            /* WEATHER BACKGROUND IMAGE */
            background-image: url('https://www.pixelstalk.net/wp-content/uploads/2016/07/Download-Free-Weather-Background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            /* DARK OVERLAY TO MAKE TEXT VISIBLE */
            background-blend-mode: overlay;
            background-color: rgba(0,0,0,0.4);
        }

        input, button {
            padding: 10px;
            margin: 10px;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }

        button {
            cursor: pointer;
            background: #ffffff;
            color: #000;
            font-weight: bold;
        }

        #weather, #forecast {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            margin: 20px auto;
            width: 300px;
            border-radius: 10px;
        }
    </style>

</head>
<body>

<h1>Weather App</h1>

<!-- INPUT & BUTTONS -->
<input type="text" id="cityInput" placeholder="Enter city">
<button onclick="getWeather()">Search</button>
<button onclick="getForecast()">5 Day Forecast</button>

<p id="datetime"></p>

<div id="weather"></div>
<div id="forecast"></div>

<script>
    const apiKey = "be8bb95c8e27551ea7cd120c925132ad";

    // LIVE DATE & TIME
    setInterval(() => {
        document.getElementById("datetime").innerText = new Date().toLocaleString();
    }, 1000);

    // CURRENT WEATHER
    function getWeather() {
        let city = document.getElementById("cityInput").value.trim();
        if (!city) return alert("Enter a city name");

        fetch("https://api.openweathermap.org/data/2.5/weather?q=" + city +
              "&appid=" + apiKey + "&units=metric")
            .then(res => res.json())
            .then(data => {
                if (data.cod != 200) {
                    document.getElementById("weather").innerHTML = "City not found!";
                    return;
                }

                let icon = "https://openweathermap.org/img/wn/" +
                           data.weather[0].icon + "@2x.png";

                document.getElementById("weather").innerHTML =
                    "<h2>" + data.name + "</h2>" +
                    "<img src='" + icon + "'>" +
                    "<p>" + data.weather[0].description + "</p>" +
                    "<p>Temp: " + data.main.temp + "°C</p>" +
                    "<p>Humidity: " + data.main.humidity + "%</p>";
            });
    }

    // 5-DAY FORECAST
    function getForecast() {
        let city = document.getElementById("cityInput").value.trim();
        if (!city) return alert("Enter a city name");

        fetch("https://api.openweathermap.org/data/2.5/forecast?q=" + city +
              "&appid=" + apiKey + "&units=metric")
            .then(res => res.json())
            .then(data => {
                if (data.cod != "200") {
                    document.getElementById("forecast").innerHTML =
                        "Forecast not available.";
                    return;
                }

                let out = "";
                for (let i = 0; i < data.list.length; i += 8) {
                    let item = data.list[i];
                    let icon = "https://openweathermap.org/img/wn/" +
                               item.weather[0].icon + "@2x.png";

                    out +=
                        "<div style='margin-bottom:15px'>" +
                        "<h3>" + item.dt_txt.split(' ')[0] + "</h3>" +
                        "<img src='" + icon + "'>" +
                        "<p>" + item.weather[0].description + "</p>" +
                        "<p>" + item.main.temp + "°C</p>" +
                        "</div>";
                }

                document.getElementById("forecast").innerHTML = out;
            });
    }
</script>

</body>
</html>
